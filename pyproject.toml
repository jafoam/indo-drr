[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idr-ge"
version = "0.1.0"
description = "Indonesian Disaster Readiness & Gap Explorer"
authors = [{ name = "AI Orchestrator" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "streamlit>=1.30.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "libpysal>=4.8.0",
    "esda>=2.5.0",
    "spreg>=1.9.0",
    "plotly>=5.18.0",
    "pydeck>=0.8.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
